spring.application.name=GemeloTriburarioBackend

# Base de datos (MySQL / XAMPP local) — misma base que usas en phpMyAdmin
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gemelotributariobase?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate — crea/actualiza las 18 tablas solo, a partir de los modelos
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

server.port=${PORT:8080}

# Fotos de perfil — se guardan en disco, en la carpeta ./uploads/perfil
app.upload.dir=uploads
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB


# Envio de correo (recuperacion de contrasena) — Gmail SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=tribnexsoporte@gmail.com
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.recuperacion.token-expiracion-minutos=15
app.frontend.url=${FRONTEND_URL:http://localhost:5500}

# Swagger — UI en /swagger-ui.html, JSON en /v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs


gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=gemini-3.8-flash
app.soporte.correo-destino=tribnexsoporte@gmail.com

app.storage=${STORAGE_MODE:local}
supabase.url=${SUPABASE_URL:}
supabase.key=${SUPABASE_SECRET_KEY:}
supabase.bucket=${SUPABASE_BUCKET:archivos}