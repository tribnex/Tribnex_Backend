# Perfil de PRODUCCIÓN (Render + Supabase).
# Se activa con SPRING_PROFILES_ACTIVE=prod
# Las credenciales llegan por variables de entorno, no van aquí.

# --- Base de datos: PostgreSQL (Supabase) ---
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# --- JPA ---
# "update" crea las tablas en el primer arranque.
# Cuando ya estén creadas y migradas, cámbialo a "none" o "validate".
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# --- Valores de respaldo para que el arranque no falle si falta una variable ---
spring.mail.password=${MAIL_PASSWORD:}
gemini.api.key=${GEMINI_API_KEY:}

# --- Correo: en Render gratis el SMTP está bloqueado, se envía por la API de Brevo ---
brevo.api.key=${BREVO_API_KEY:}
app.mail.from=${MAIL_FROM:tribnexsoporte@gmail.com}
app.mail.from-name=Tribnex

# En producción los archivos van a Supabase Storage
app.storage=${STORAGE_MODE:supabase}
# El plan gratuito de Supabase no admite archivos de más de 50 MB
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

mail.relay.url=${MAIL_RELAY_URL:}
mail.relay.token=${MAIL_RELAY_TOKEN:}